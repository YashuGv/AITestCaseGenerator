<div class="animate-fade-in">
  <div class="flex justify-between items-center mb-1.5">
    <span class="text-xs text-slate-500">{{ message }}</span>
    <span class="text-xs font-semibold text-blue-600">{{ progress }}%</span>
  </div>
  <div class="h-1.5 bg-slate-100 rounded-full overflow-hidden">
    <div
      class="h-full rounded-full transition-all duration-500 ease-out" [style.width.%]="progress"
      style="background: linear-gradient(90deg, #2563eb, #7c3aed, #38bdf8);">
    </div>
  </div>
</div>
