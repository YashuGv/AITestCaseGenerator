<div class="flex items-center gap-3 p-3 rounded-xl border border-slate-200
            bg-slate-50 animate-slide-up">

  <!-- File type icon -->
  <div [class]="'w-10 h-10 rounded-xl bg-gradient-to-br ' + iconColor +
                ' flex items-center justify-center flex-shrink-0 shadow-sm'">
    <span class="text-white text-xs font-bold">{{ fileExtLabel }}</span>
  </div>

  <!-- File info -->
  <div class="flex-1 min-w-0">
    <p class="text-sm font-semibold text-slate-800 truncate">{{ displayName }}</p>
    <p class="text-xs text-slate-400 mt-0.5">{{ displaySize }} · Ready to process</p>
  </div>

  <!-- Remove button -->
  <button
    (click)="remove()"
    aria-label="Remove file"
    class="flex-shrink-0 p-1 rounded-lg text-slate-400
           hover:text-red-500 hover:bg-red-50 transition-colors duration-150">
    <svg class="w-4 h-4" fill="none" viewBox="0 0 24 24"
         stroke="currentColor" stroke-width="2">
      <path stroke-linecap="round" stroke-linejoin="round" d="M6 18L18 6M6 6l12 12"/>
    </svg>
  </button>

</div>
