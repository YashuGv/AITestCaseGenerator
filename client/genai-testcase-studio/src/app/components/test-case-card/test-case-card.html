<div class="border border-slate-200 rounded-xl p-4 bg-slate-50
            hover:border-blue-300 hover:bg-white hover:translate-x-0.5
            transition-all duration-150 cursor-default animate-slide-up">

  <div class="flex items-center justify-between gap-2 mb-2">
    <span class="font-mono text-xs font-bold text-blue-600">{{ testCase.id }}</span>
    <div class="flex gap-1.5 flex-wrap justify-end">
      <span [class]="'px-2 py-0.5 rounded-full text-[10px] font-bold border ' + typeBadgeClass">
        {{ testCase.type }}
      </span>
      <span [class]="'px-2 py-0.5 rounded-full text-[10px] font-bold border ' + priorityBadgeClass">
        {{ testCase.priority }}
      </span>
    </div>
  </div>

  <p class="text-sm font-semibold text-slate-800 mb-2 leading-snug">
    {{ testCase.title }}
  </p>

  <div class="flex flex-col gap-0.5">
    @for (step of testCase.steps; track $index) {
      <p class="text-xs text-slate-500 leading-relaxed">
        {{ step }}
      </p>
    }
  </div>

  <div class="mt-2.5 pt-2.5 border-t border-slate-200">
    <span class="text-[10px] font-bold uppercase tracking-wide text-slate-400">Expected: </span>
    <span class="text-xs text-slate-600">{{ testCase.expected }}</span>
  </div>

</div>
