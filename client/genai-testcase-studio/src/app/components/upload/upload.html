<div>
  <!-- Drop zone -->
  <div
    [class]="isDragOver
      ? 'border-blue-500 bg-blue-50'
      : 'border-slate-200 bg-slate-50 hover:border-blue-400 hover:bg-blue-50'"
    class="relative border-2 border-dashed rounded-2xl p-8 text-center
           cursor-pointer transition-all duration-200 group"
    (click)="onBrowse(fileInput)">

    <!-- Upload icon -->
    <div class="w-12 h-12 rounded-xl bg-blue-100 flex items-center justify-center
                mx-auto mb-3 group-hover:scale-105 transition-transform duration-200">
      <svg class="w-6 h-6 text-blue-600" fill="none" viewBox="0 0 24 24"
           stroke="currentColor" stroke-width="2">
        <path stroke-linecap="round" stroke-linejoin="round"
              d="M4 16v1a2 2 0 002 2h12a2 2 0 002-2v-1M12 12V4m0 0L8 8m4-4l4 4"/>
      </svg>
    </div>

    <p class="font-semibold text-slate-800 text-sm mb-1">
      {{ isDragOver ? 'Drop your file here' : 'Drag & drop your file here' }}
    </p>
    <p class="text-slate-400 text-xs mb-3">or click to browse</p>

    <!-- File type chips -->
    <div class="flex justify-center gap-2">
      @for (t of ['TXT','PDF','DOCX']; track t) {
          <span class="px-2.5 py-0.5 rounded-full text-xs font-semibold bg-blue-100 text-blue-700">{{ t }}</span>
      }
    </div>

    <!-- Hidden file input -->
    <input #fileInput type="file"
           accept=".txt,.pdf,.docx"
           class="hidden"
           (change)="onFileChange($event)">
  </div>

  <!-- Validation error -->
   @if(errorMsg){
    <p class="mt-2 text-xs text-red-600 flex items-center gap-1">
      <span>⚠</span> {{ errorMsg }}
    </p>
   }
</div>
