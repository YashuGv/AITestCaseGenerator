<div class="flex flex-col gap-4">

  <!-- Output type -->
  <div>
    <label class="block text-xs font-semibold text-slate-500 mb-1.5 uppercase tracking-wide">
      Output Type
    </label>
    <div class="relative">
      <select
        [value]="outputType"
        (change)="onTypeChange($event)"
        class="w-full appearance-none border border-slate-200 rounded-xl
               px-3 py-2.5 pr-8 text-sm bg-white text-slate-800
               focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-transparent
               transition-colors duration-150 cursor-pointer">
        @for(t of outputTypes; track t;){
          <option [value]="t">{{ t }}</option>
        }
      </select>
      <!-- Chevron -->
      <svg class="pointer-events-none absolute right-2.5 top-1/2 -translate-y-1/2
                  w-4 h-4 text-slate-400"
           fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
        <path stroke-linecap="round" stroke-linejoin="round" d="M19 9l-7 7-7-7"/>
      </svg>
    </div>
  </div>

  <!-- Additional instructions -->
  <div>
    <label class="block text-xs font-semibold text-slate-500 mb-1.5 uppercase tracking-wide">
      Additional Instructions
      <span class="normal-case font-normal text-slate-400 ml-1">(optional)</span>
    </label>
    <textarea
      [value]="instructions"
      (input)="onInstructionsInput($event)"
      rows="3"
      placeholder="e.g. Focus on edge cases for the login module. Include boundary value tests for all numeric inputs."
      class="w-full border border-slate-200 rounded-xl px-3 py-2.5 text-sm
             bg-white text-slate-800 placeholder-slate-400 resize-none
             focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-transparent
             transition-colors duration-150">
    </textarea>
  </div>

</div>
